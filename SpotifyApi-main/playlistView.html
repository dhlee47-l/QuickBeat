<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Beat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <link rel="stylesheet" type="text/css" href="css/main.css">
</head>
<body>
<button id="playlist-btn" class="btn btn-primary btn-main">View Playlists</button>
<div id="playlist-container"></div>
<script type="module" src="js/spotifyAuth.js"></script>
<script type="module">
    import * as SpotifyAPI from './js/SpotifyAPI.js';

    document.getElementById("playlist-btn").onclick = function () {
        SpotifyAPI._getUserPlaylist().then(data => {
            const list = document.getElementById('playlist-container');
             data.items.forEach(playlist => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                
                // Example: show name + total tracks
                item.innerHTML = `
                    <h3>${playlist.name}</h3>
                    <p>${playlist.tracks.total} tracks</p>
                `;

                // Optionally, show playlist image
                if (playlist.images && playlist.images.length > 0) {
                    const img = document.createElement('img');
                    img.src = playlist.images[0].url;
                    img.alt = playlist.name;
                    img.style.width = '100px';
                    img.style.height = '100px';
                    item.prepend(img); // add image before text
                }

                list.appendChild(item);
            });
        });
    };



   

</script>
</body>

</html>
